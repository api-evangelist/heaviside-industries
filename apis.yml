name: Heaviside Industries
description: Heaviside Industries is a defense-technology company founded in 2024 in Los Angeles,
  California, building autonomous precision munitions for U.S. and allied special operations and
  conventional forces. Its products — MOTH (land electromagnetic signal intelligence and spectrum
  awareness), TYR (autonomous aerial munition), and HYDRA (autonomous underwater munition) — are
  designed to deliver hyper-precise strike capabilities across air, land, and sea in GPS-denied and
  contested environments. Named after physicist Oliver Heaviside, whose electromagnetic theory
  enabled miniaturized electronics, the company emerged from stealth in May 2026 with a $28M Series A.
  It does not currently publish a public API, developer portal, SDKs, or machine-readable API artifacts.
